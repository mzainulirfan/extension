<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopee Resi Chat Helper</title>
  <style>
    :root {
      color-scheme: light;
      --accent: #ee4d2d;
      --accent-dark: #c83f23;
      --border: #d9dde5;
      --text: #20242c;
      --muted: #606775;
      --surface: #ffffff;
      --page: #f4f6f8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 340px;
      font-family: Arial, sans-serif;
      background: var(--page);
      color: var(--text);
    }

    .container {
      display: grid;
      gap: 12px;
      padding: 14px;
    }

    h1 {
      margin: 0;
      font-size: 17px;
      line-height: 1.25;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .status-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
    }

    .badge {
      border-radius: 999px;
      padding: 4px 8px;
      background: #e8f3ea;
      color: #1d6f35;
      font-size: 12px;
      white-space: nowrap;
    }

    .badge.error {
      background: #fde9e5;
      color: #a93620;
    }

    .muted {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button {
      min-height: 36px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: var(--accent-dark);
    }

    button.secondary {
      background: #fff;
      border-color: var(--border);
      color: var(--text);
    }

    button.secondary:hover {
      background: #f2f4f7;
    }

    .settings {
      display: grid;
      gap: 8px;
    }

    label {
      display: grid;
      grid-template-columns: 1fr 90px;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
    }

    input[type="number"] {
      width: 90px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 8px;
      font-size: 12px;
      color: var(--text);
    }

    .toggle {
      grid-template-columns: auto 1fr;
      justify-content: start;
    }

    .toggle input {
      width: 16px;
      height: 16px;
    }

    .log-list {
      display: grid;
      gap: 6px;
      max-height: 138px;
      overflow: auto;
      padding-right: 2px;
    }

    .log-item {
      border-bottom: 1px solid #eef0f3;
      padding-bottom: 6px;
      font-size: 12px;
      line-height: 1.35;
    }

    .log-item:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Shopee Resi Chat Helper</h1>

    <section class="panel">
      <div class="status-line">
        <strong>Status</strong>
        <span class="badge" id="activeBadge">Memuat</span>
      </div>
      <div id="popupStatus" class="muted">Mengambil status dari halaman aktif...</div>
      <div class="muted" id="lastResi">Resi terakhir: -</div>
    </section>

    <section class="panel">
      <div class="actions">
        <button id="focusResiBtn">Fokus Resi</button>
        <button id="runFlowBtn">Jalankan Flow</button>
        <button id="retryChatBtn" class="secondary">Retry</button>
        <button id="refreshBtn" class="secondary">Refresh</button>
      </div>
    </section>

    <section class="panel settings">
      <strong>Setting</strong>
      <label>
        Delay setelah scan
        <input id="delayAfterScan" type="number" min="0" max="10000" step="100" />
      </label>
      <label>
        Timeout tombol chat
        <input id="chatButtonTimeout" type="number" min="500" max="30000" step="500" />
      </label>
      <label>
        Timeout sidebar chat
        <input id="sidebarTimeout" type="number" min="500" max="30000" step="500" />
      </label>
      <label>
        Delay refocus
        <input id="refocusDelay" type="number" min="0" max="10000" step="100" />
      </label>
      <label class="toggle">
        <input id="debugLog" type="checkbox" />
        <span>Aktifkan debug log</span>
      </label>
    </section>

    <section class="panel">
      <strong>Log Terakhir</strong>
      <div id="logList" class="log-list muted">Belum ada log.</div>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
